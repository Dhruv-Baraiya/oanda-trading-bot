services:
  - type: web
    name: trading-bot-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: packages/backend
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_BASE_URL
        value: https://api-fxpractice.oanda.com
      - key: MONGODB_URI
        sync: false
      - key: ML_SERVICE_URL
        value: https://trading-bot-ml-hv3o.onrender.com
      - key: D1_WORKER_URL
        sync: false
      - key: D1_API_KEY
        sync: false

  - type: web
    name: trading-bot-ml
    runtime: docker
    region: singapore
    plan: free
    rootDir: packages/ml-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: D1_WORKER_URL
        sync: false
      - key: D1_API_KEY
        sync: false
